user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;

        server_name localhost;

        location / {
          root   /app;
          index  index.html;
          try_files $uri $uri/ /index.html;
        }


        # Proxy API requests to the Flask backend
        location /api/ {
            proxy_pass http://cask-and-cup-backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # After a successful OIDC login the session cookie carries the full
            # id_token/access_token/userinfo set, which can exceed nginx's
            # default 4k header buffer, causing "upstream sent too big header".
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;
            proxy_busy_buffers_size 32k;
        }
    }
}
