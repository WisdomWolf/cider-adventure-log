name: Build and push Docker images

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: cider-adventure-log-api
            dockerfile: Dockerfile.backend
          - image: cider-adventure-log-frontend
            dockerfile: Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lowercase repository owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  update-manifests:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Update image tags in manifests
        run: |
          sed -i "s|ghcr.io/wisdomwolf/cider-adventure-log-api:sha-[0-9a-f]*|ghcr.io/wisdomwolf/cider-adventure-log-api:sha-${SHORT_SHA}|g" k8s/backend-deployment.yaml k8s/migrations-job.yaml
          sed -i "s|ghcr.io/wisdomwolf/cider-adventure-log-frontend:sha-[0-9a-f]*|ghcr.io/wisdomwolf/cider-adventure-log-frontend:sha-${SHORT_SHA}|g" k8s/frontend-deployment.yaml

      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend-deployment.yaml k8s/frontend-deployment.yaml k8s/migrations-job.yaml
          git diff --staged --quiet || git commit -m "ci: deploy sha-${SHORT_SHA}"
          git push
