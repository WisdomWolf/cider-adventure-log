services:
  frontend:
    container_name: cider-log-frontend
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      web:
    ports:
      - 8080:80
  api:
    container_name: cider-log-api
    hostname: cider-api
    environment:
      PORT: 5000
      FLASK_DEBUG:
      FLASK_ENV:
      FLASK_RUN_PORT: 5000
      FLASK_RUN_HOST: 0.0.0.0
      APP_ENV: development
      FLASK_DB_URI: postgresql://postgres@flask_db:5432/postgres
      SECRET_KEY:
      AUTHENTIK_ISSUER:
      AUTHENTIK_CLIENT_ID:
      AUTHENTIK_CLIENT_SECRET:
      AUTHENTIK_REDIRECT_URI:
      AUTHENTIK_AUTO_PROVISION_GROUP:
    build:
      context: .
      dockerfile: Dockerfile.backend
    networks:
      web:
  db:
    image: postgres:17.4-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    expose:
      - 5432
    profiles:
      - debug
      - development
    networks:
      web:
        aliases:
          - flask_db
          - postgres

volumes:
  postgres_data:

networks:
  web:
    external: true