apiVersion: apps/v1
kind: Deployment
metadata:
  name: cask-and-cup-frontend
  namespace: cask-and-cup
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cask-and-cup-frontend
  template:
    metadata:
      labels:
        app: cask-and-cup-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/wisdomwolf/cider-adventure-log-frontend:sha-b3a20b2
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cask-and-cup-frontend
  namespace: cask-and-cup
spec:
  selector:
    app: cask-and-cup-frontend
  ports:
    - port: 80
      targetPort: 80
