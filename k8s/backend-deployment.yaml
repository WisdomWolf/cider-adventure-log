apiVersion: apps/v1
kind: Deployment
metadata:
  name: cask-and-cup-backend
  namespace: cask-and-cup
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cask-and-cup-backend
  template:
    metadata:
      labels:
        app: cask-and-cup-backend
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: api
          image: ghcr.io/wisdomwolf/cider-adventure-log-api:sha-a5befad
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: "production"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cask-and-cup-secrets
                  key: SECRET_KEY
            - name: FLASK_DB_URI
              valueFrom:
                secretKeyRef:
                  name: cask-and-cup-secrets
                  key: FLASK_DB_URI
            - name: AUTHENTIK_ISSUER
              value: "https://authentik.developingwisdom.org/application/o/cask-and-cup/"
            - name: AUTHENTIK_REDIRECT_URI
              value: "https://caskandcup.developingwisdom.org/api/auth/sso/callback"
            - name: AUTHENTIK_AUTO_PROVISION_GROUP
              value: "Cask & Cup Users"
            - name: AUTHENTIK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cask-and-cup-secrets
                  key: AUTHENTIK_CLIENT_ID
            - name: AUTHENTIK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cask-and-cup-secrets
                  key: AUTHENTIK_CLIENT_SECRET
          # Gates liveness/readiness until the app has actually come up, instead of
          # guessing an initialDelaySeconds -- the previous fixed 10s delay was too
          # short once the CPU limit below was throttling gunicorn's 4-worker boot.
          startupProbe:
            httpGet:
              path: /api/health
              port: 5000
            periodSeconds: 5
            failureThreshold: 12 # up to 60s to come up
            timeoutSeconds: 3
          # Liveness is deliberately decoupled from the database (see /api/health):
          # this endpoint used to be /api/beverages, so DB latency or CFS throttling
          # (see resources below) could kill and restart the container repeatedly.
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/beverages
              port: 5000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            # No CPU limit: gunicorn's 4 workers booting together were being
            # CFS-throttled ~99% of the time under a 500m limit (usage was only
            # ~0.1 core on average), which delayed startup past the liveness probe
            # and caused a continuous restart loop. The request still guarantees a
            # CPU share; there's no limit for the node scheduler to throttle against.
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cask-and-cup-backend
  namespace: cask-and-cup
spec:
  selector:
    app: cask-and-cup-backend
  ports:
    - port: 5000
      targetPort: 5000
